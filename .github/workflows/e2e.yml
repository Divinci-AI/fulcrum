name: E2E

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
  schedule:
    # Nightly prod probe at 09:00 UTC (~02:00 PT).
    - cron: '0 9 * * *'

# Cancel previous runs on the same branch.
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local:
    name: E2E (local, ephemeral container)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: docker/setup-buildx-action@v3

      - name: Install npm deps
        run: bun install

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: Build Fulcrum image (linux/amd64, --load)
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --load \
            -t divinci-ai/fulcrum:dev \
            .

      - name: Boot ephemeral Fulcrum
        run: |
          docker compose -f e2e/docker-compose.test.yml up -d --wait
          sleep 3
          curl -fsS http://localhost:17777/health

      - name: Playwright tests (local project)
        run: bunx playwright test --config=e2e/playwright.config.ts --project=local

      - name: Container logs on failure
        if: failure()
        run: docker logs fulcrum-e2e | tail -200

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-local
          path: playwright-report/
          retention-days: 7

      - name: Tear down
        if: always()
        run: docker compose -f e2e/docker-compose.test.yml down -v

  prod-probe:
    # Nightly only — the prod probe is slow plus flaky against real Cloudflare,
    # so we don't gate PRs on it.
    name: E2E (prod probe, fulcrum-acme.divinci.ai)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bunx playwright install --with-deps chromium

      - name: Playwright tests (prod project)
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          FULCRUM_E2E_PROD_URL: https://fulcrum-acme.divinci.ai
        run: bunx playwright test --config=e2e/playwright.config.ts --project=prod

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-prod
          path: playwright-report/
          retention-days: 14
